# ============================================================
# Voice (Local Windows GPU Service) — Configuration
# ============================================================

# --- TTS Engine ---
tts:
  model: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
  device: "cuda"                     # "cuda" | "cpu"
  dtype: "float16"                   # "float16" | "bfloat16" | "float32"
  sample_rate: 24000                 # Native output sample rate (Hz)
  max_text_length: 500               # Max characters per generation call
  language: "English"                # Avoid unreliable auto-detection on short lines
  attn_implementation: "sdpa"        # ~16% faster wall time than eager in the local smoke benchmark

  # Reference-voice design settings
  voice_design_model: "Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign"
  voice_design_duration: 10          # Duration of reference clips (seconds)
  voice_design_test_sentences:
    male: "The ancient tower stood against the darkening sky as rain swept across the weathered stone."
    female: "She walked through the moonlit garden, listening as fallen leaves whispered beneath each careful step."
    neutral: "The library was vast and silent, filled with old paper, dust, and half-forgotten memories."

  # Generation parameters
  generation:
    max_new_tokens: 4096
    do_sample: true
    temperature: 0.7
    top_p: 0.9
    repetition_penalty: 1.1

# --- Quality Validation ---
validation:
  enabled: true
  keep_tts_and_whisper_resident: true  # Verified on RX 7900 XTX (18.1 GiB free VRAM, 0.6s Whisper latency)
  whisper_model: "small"           # "tiny" | "base" | "small" | "medium" | "large-v3"
  whisper_device: "cuda"            # "auto" | "cuda" | "cpu"

  # Thresholds
  wer_threshold: 0.20               # 20%
  max_retries: 3
  speaker_similarity_threshold: 0.55
  voice_profile_similarity_warning: 0.97
  voice_profile_acoustic_regenerations: 1

  # Audio checks
  artifact_noise_threshold: -50      # dB
  clipping_threshold: -0.5           # dBFS
  min_duration_seconds: 0.3
  max_silence_seconds: 3.0
  duration_tolerance: 0.6            # ±60%, plus 0.8s allowance for short lines

  # Text normalization for WER
  normalize_text: true
  expand_numbers: true
  expand_abbreviations: true

# --- Audio Mastering ---
mastering:
  target_lufs: -19                   # Internal playback target (LUFS)
  peak_limit_dbfs: -1.0
  crossfade_ms: 30
  fade_curve: "cosine"               # "linear" | "cosine" | "exponential"

  # Noise gate
  noise_gate_enabled: false          # Generated audio normally needs no gate
  noise_gate_threshold: -50
  noise_gate_attack_ms: 5
  noise_gate_release_ms: 50

  # Output format
  output_sample_rate: 44100
  output_bit_depth: 16
  output_channels: 1                 # Mono (audiobook standard)

# --- M4B Export ---
export:
  codec: "aac"
  bitrate: "128k"
  channels: 1
  default_narrator: "AI Generated"
  default_genre: "Fantasy"
  chapter_silence_ms: 2000
  embed_cover_art: true
  filename_template: "{title}"

# --- FastAPI Server ---
server:
  port: 8100
  host: "127.0.0.1"
  workers: 1                         # Keep at 1 for GPU
  cors_origins: ["http://127.0.0.1:8000", "http://localhost:8000"]
  api_token: ""
  idle_unload_seconds: 300
  max_upload_size_mb: 100

# --- Storage ---
storage:
  workspace_dir: "workspace"
  voice_library_dir: "voice_library"
  auto_cleanup_intermediates: true
  keep_voice_library: true
  max_workspace_gb: 50
